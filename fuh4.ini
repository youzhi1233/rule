[custom]
;规则集定义
ruleset=🎯 全球直连,https://proxy.v2gh.com/https://raw.githubusercontent.com/youzhi1233/rule/refs/heads/main/Direct.list
ruleset=🚀 节点选择,https://proxy.v2gh.com/https://raw.githubusercontent.com/youzhi1233/rule/refs/heads/main/ProxyLite.list
ruleset=🚀 节点选择,https://proxy.v2gh.com/https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/YouTube.list
ruleset=🐟 漏网之鱼,[]FINAL
;策略组定义
custom_proxy_group=🎯 全球直连`select`[]DIRECT`[]🚀 节点选择
#custom_proxy_group=🛑 广告拦截`select`[]REJECT`[]DIRECT
custom_proxy_group=🐟 漏网之鱼`select`[]DIRECT`[]🚀 节点选择
custom_proxy_group=🚀 节点选择`select`[]DIRECT`[]♻️ 自动选择`[]🔄 选择故转`[]🍃 负载均衡`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇸🇬 加坡节点`[]🇺🇲 美国节点`[]🌐 其他节点
custom_proxy_group=🔄 选择故转`fallback`[]♻️ 自动选择`[]🌐 其他节点`[]🇺🇲 美国节点`[]🇭🇰 香港节点`[]🍃 负载均衡`[]🇯🇵 日本节点`[]🇸🇬 加坡节点`^((?!(fh|香港|美国|HK|US|日本|JP|Japan|新加坡|SG|b2n.ir|speednode|YouTube顺丰资源)).)*$`http://cp.cloudflare.com/204`30,,20
custom_proxy_group=🍃 负载均衡`load-balance`[]♻️ 自动选择`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇸🇬 加坡节点`[]🇺🇲 美国节点`^((?!(fh|香港|美国|HK|US|日本|JP|Japan|新加坡|SG|b2n.ir|speednode|YouTube顺丰资源)).)*$`http://cp.cloudflare.com/204`120,,50
custom_proxy_group=🇭🇰 香港节点`url-test`(?=.*(fh|香港|HK|speednode))^((?!(深圳|家宽)).)*$`http://cp.cloudflare.com/204`300,,100
custom_proxy_group=🇯🇵 日本节点`url-test`(?=.*(日本|JP|Japan|YouTube顺丰资源))^((?!(深圳|家宽|香港)).)*$`http://cp.cloudflare.com/204`600,,100
custom_proxy_group=🇸🇬 加坡节点`url-test`(?=.*(新加坡|SG|b2n.ir))^((?!(深圳|家宽|speednode)).)*$`http://cp.cloudflare.com/204`600,,100
custom_proxy_group=🇺🇲 美国节点`url-test`(?=.*(fh|美国|US))^((?!(深圳|家宽)).)*$`http://cp.cloudflare.com/204`300,,50
custom_proxy_group=🌐 其他节点`url-test`^((?!(fh|香港|美国|HK|US|日本|JP|Japan|新加坡|SG|b2n.ir|speednode|YouTube顺丰资源)).)*$`http://cp.cloudflare.com/204`300,,50
custom_proxy_group=♻️ 自动选择`url-test`.*`http://cp.cloudflare.com/204`900,,200
;启用自定义规则集
enable_rule_generator=true
overwrite_original_rules=true

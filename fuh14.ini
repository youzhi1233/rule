;=======================
; 规则集定义（三层分流）
;=======================
ruleset=🚀 节点选择,https://proxy.v2gh.com/https://raw.githubusercontent.com/youzhi1233/rule/main/ProxyLite.list
ruleset=🐟 漏网之鱼,[]FINAL

;=======================
; 策略组架构（四层筛选）
;=======================
; 第一层：基础节点池
custom_proxy_group=🔍 初筛组`url-test`.*`https://connect.rom.miui.com/generate_204`300,100,50

; 第二层：质量过滤
custom_proxy_group=🔬 精筛组`url-test`.*`https://www.gstatic.com/generate_204`60,50,30

; 第三层：业务分流
custom_proxy_group=🚀 节点选择`select`[]🔬 精筛组`[]🔄 故障转移`[]⚖️ 动态均衡
custom_proxy_group=🔄 故障转移`fallback`[]🔬 精筛组`https://cp.cloudflare.com/generate_204`180,80,40
custom_proxy_group=⚖️ 动态均衡`load-balance`.*`https://cp.cloudflare.com/generate_204`300,100,20`10

; 第四层：兜底策略
custom_proxy_group=🐟 漏网之鱼`select`[]DIRECT`[]🚀 节点选择

; 性能优化
health_check_interval=300
lazy_health_check=true
enable_tcp_check=true

; 规则控制
enable_rule_generator=true
overwrite_original_rules=true
rule_priority=50

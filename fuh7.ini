custom_proxy_group=🇭🇰 香港节点`load-balance`(?=.*(香港|HK|Hong Kong|🇭🇰|HongKong))^((?!(深港|US|家宽|游戏|剩余|流量|2.0|2倍|2x|3.0|3倍|3x|4.0|4倍|4x)).)*$`http://cp.cloudflare.com/204`300,,20
custom_proxy_group=🇯🇵 日本节点`load-balance`(?=.*(日本|未知|川日|东京|大阪|泉日|埼玉|沪日|深日|JP|Japan))^((?!(深港|家宽|游戏|剩余|流量|0.5|0.5倍|0.5x|2.0|2倍|2x|3.0|3倍|3x|4.0|4倍|4x|5.0|5倍|5x)).)*$`http://cp.cloudflare.com/204`300,,20

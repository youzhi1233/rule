custom_proxy_group=🇺🇲 美国节点`load-balance`(美|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|拉斯维加斯|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥|US|United States)`http://cp.cloudflare.com/204`300,,20
custom_proxy_group=🌐 其他节点`load-balance`(^(?!.*(香港|新加坡|德国|日本|未知|美国|US|United States)).*)`http://cp.cloudflare.com/204`300,,20


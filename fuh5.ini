[custom]
;规则集定义
ruleset=🚀 节点选择,https://proxy.v2gh.com/https://raw.githubusercontent.com/youzhi1233/rule/refs/heads/main/ProxyLite.list
ruleset=🐟 漏网之鱼,[]FINAL
;策略组定义
custom_proxy_group=🎯 全球直连`select`[]DIRECT`[]🚀 节点选择
custom_proxy_group=🐟 漏网之鱼`select`[]DIRECT`[]🚀 节点选择
custom_proxy_group=🚀 节点选择`select`[]🇭🇰 美国节点`[]♻️ 自动选择`[]🇸🇬 选择故转`[]🇺🇲 选择均衡
custom_proxy_group=🇭🇰 美国节点`select`(?=.*(fh|香港))
custom_proxy_group=♻️ 自动选择`url-test`.*`http://www.gstatic.com/generate_204`300,,500
custom_proxy_group=🇸🇬 选择故转`fallback`.*`http://www.gstatic.com/generate_204`300,,500
custom_proxy_group=🇺🇲 选择均衡`load-balance`(?=.*(fh|fu))^((?!(深圳|家宽)).)*$`http://www.gstatic.com/generate_204`300,,50

; 性能优化
health_check_interval=300
lazy_health_check=true
enable_tcp_check=true

; 规则控制
enable_rule_generator=true
overwrite_original_rules=true
rule_priority=50

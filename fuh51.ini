[custom]
;规则集定义
ruleset=🎯 全球直连,https://proxy.v2gh.com/https://raw.githubusercontent.com/youzhi1233/rule/refs/heads/main/Direct.list
ruleset=🚀 节点选择,https://proxy.v2gh.com/https://raw.githubusercontent.com/youzhi1233/rule/refs/heads/main/ProxyLite.list
#ruleset=🎯 全球直连,[]GEOSITE,CN
#ruleset=🚀 节点选择,[]GEOSITE,geolocation-!cn
#ruleset=🎯 全球直连,[]GEOIP,CN,no-resolve
ruleset=🐟 漏网之鱼,[]FINAL
;策略组定义
custom_proxy_group=🎯 全球直连`select`[]DIRECT`[]🚀 节点选择
custom_proxy_group=🐟 漏网之鱼`select`[]DIRECT`[]🚀 节点选择
custom_proxy_group=🚀 节点选择`select`[]精筛组`[]优质节点`[]智能负载`[]核心业务

; 第一层：基础过滤（快速剔除无效节点）
custom_proxy_group=初筛组`url-test`.*`https://cp.cloudflare.com/generate_204`600,500,3

; 第二层：严格筛选（优选低延迟节点）
custom_proxy_group=精筛组`url-test`.*`https://www.gstatic.com/generate_204`300,100,5
; 第三层：动态优质池（结合两种检测方式）
custom_proxy_group=优质节点`fallback`[]精筛组`https://cp.cloudflare.com/generate_204`180,80
; 负载均衡优选
custom_proxy_group=智能负载`load-balance`[]优质节点`https://ei.phncdn.com`300,50,10
; 关键业务专用
custom_proxy_group=核心业务`url-test`[]优质节点`https://api.zoom.us`120,80

;启用自定义规则集
enable_rule_generator=true
overwrite_original_rules=true

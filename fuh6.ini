custom_proxy_group=⭐ 测试1`load-balance`[]🍃 负载均衡`[]♻️ 自动选择`[]🔄 选择故转`http://cp.cloudflare.com/204`150,,20
custom_proxy_group=⭐ 测试2`fallback`[]🍃 负载均衡`[]♻️ 自动选择`[]🔄 选择故转`http://cp.cloudflare.com/204`150,,20
custom_proxy_group=⭐ 测试3`url-test`[]🍃 负载均衡`[]♻️ 自动选择`[]🔄 选择故转`http://cp.cloudflare.com/204`150,,20
custom_proxy_group=🔄 选择故转`fallback`[]🌐 其他节点`[]🇺🇲 美国节点`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇸🇬 加坡节点`http://cp.cloudflare.com/204`300,,20
custom_proxy_group=🍃 负载均衡`load-balance`[]🌐 其他节点`[]🇺🇲 美国节点`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇸🇬 加坡节点`http://cp.cloudflare.com/204`300,,20
custom_proxy_group=♻️ 自动选择`url-test`[]🌐 其他节点`[]🇺🇲 美国节点`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇸🇬 加坡节点`http://cp.cloudflare.com/204`300,,20
custom_proxy_group=🇭🇰 香港节点`load-balance`(?=.*(fh|香港|HK|speednode))^((?!(深圳|家宽)).)*$`http://cp.cloudflare.com/204`600,,20
custom_proxy_group=🇯🇵 日本节点`load-balance`(?=.*(日本|JP|Japan|YouTube顺丰资源|Telegram))^((?!(深圳|家宽|香港)).)*$`http://cp.cloudflare.com/204`600,,20
custom_proxy_group=🇸🇬 加坡节点`load-balance`(?=.*(新加坡|SG|b2n.ir))^((?!(深圳|家宽|speednode)).)*$`http://cp.cloudflare.com/204`600,,20
custom_proxy_group=🇺🇲 美国节点`load-balance`(?=.*(fh|美国|US))^((?!(深圳|家宽)).)*$`http://cp.cloudflare.com/204`600,,20
custom_proxy_group=🌐 其他节点`load-balance`^((?!(fh|香港|美国|HK|US|日本|JP|Japan|新加坡|SG|b2n.ir|speednode|YouTube顺丰资源|Telegram)).)*$`http://cp.cloudflare.com/204`600,,20

;启用自定义规则集
enable_rule_generator=true
overwrite_original_rules=true
